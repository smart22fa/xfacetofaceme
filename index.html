<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a1f44;
      color: #ffffff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .loader-container {
      text-align: center;
      width: 90%;
      max-width: 420px;
    }

    .spinner {
      width: 52px;
      height: 52px;
      margin: 0 auto 24px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      opacity: 0.75;
    }

    .progress {
      width: 100%;
      height: 4px;
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #ffffff;
      animation: progress 3s linear forwards;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }
  </style>
</head>

<body>

  <div class="loader-container">
    <div class="spinner"></div>
    <h1>Loading, please wait...</h1>
    <p>You will be redirected shortly.</p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>
  </div>

  <script>
    /*
      ============================================================
      PUT YOUR DESTINATION LINK HERE
      Replace the URL between the quotation marks below.
      Example:
      const REDIRECT_URL = "https://example.com";
      ============================================================
    */
    const REDIRECT_URL = "https://original-birthday-593863.framer.app/";

    /*
      ONE-TIME REDIRECT
      The page redirects only once per browser.
      After the redirect has happened, returning to this page
      will not redirect again in the same browser.
    */
    const REDIRECT_KEY = "redirect_already_completed";

    if (!localStorage.getItem(REDIRECT_KEY)) {
      setTimeout(function () {
        localStorage.setItem(REDIRECT_KEY, "true");
        window.location.replace(REDIRECT_URL);
      }, 3000);
    } else {
      document.querySelector("h1").textContent = "Already completed";
      document.querySelector("p").textContent =
        "This page has already completed its redirect in this browser.";
      document.querySelector(".progress-bar").style.width = "100%";
    }
  </script>

</body>
</html>
